# Configuración de nginx para Azure App Service (Linux, PHP 8.x).
# nginx ignora .htaccess, así que aquí se replican las reglas de enlaces permanentes de WordPress.
# En Azure, Configuración > Configuración general > Comando de inicio:
#   cp /home/site/wwwroot/nginx-default.conf /etc/nginx/sites-available/default && service nginx reload
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    server_name _;
    port_in_redirect off;

    location / {
        # Si no existe el archivo ni la carpeta, se pasa la petición a WordPress (igual que .htaccess).
        try_files $uri $uri/ /index.php?$args;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /html/;
    }

    # No servir archivos ocultos ni este archivo de configuración.
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location = /nginx-default.conf { deny all; }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
}
