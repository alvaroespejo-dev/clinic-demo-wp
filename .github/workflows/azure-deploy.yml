name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: clinicdemopw

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar paquete
        # Copia el proyecto sin el control de versiones, este workflow ni la copia con credenciales.
        # wp-config.php sí se despliega: lee la conexión de las App Settings de Azure.
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='wp-config - Copy.php' \
            ./ "$RUNNER_TEMP/deploy/"

      - name: Desplegar en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/deploy
